<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071c24"><title>Reality Fishing Adventure V5 · 晒这一条</title><style>
:root{--bg:#061a21;--panel:#0d2c36;--panel2:#153d48;--text:#eff9f6;--muted:#9db7b6;--line:#2b5861;--green:#7de2bb;--gold:#ffd275;--hot:#ff947f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -8%,#184a55 0,#092a34 40%,#061a21 100%);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:720px;margin:auto;padding:14px 14px 42px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand b{font-size:15px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.ghost,.secondary{border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--text);border-radius:15px;padding:11px 13px}.hero{padding:28px 5px 14px}.kicker{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--gold)}h1{font-size:34px;line-height:1.08;margin:8px 0 10px}.lead{color:var(--muted);line-height:1.55}.card{background:rgba(13,44,54,.94);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}.gold{border-color:rgba(255,210,117,.48)}.green{border-color:rgba(125,226,187,.5)}.title{font-size:22px;line-height:1.28;margin:7px 0}.sub{font-size:14px;line-height:1.5;color:var(--muted)}button,input,select{font:inherit}.primary,.choice,.upload{width:100%;min-height:54px;border-radius:17px;padding:14px 15px;margin-top:10px}.primary{border:0;background:var(--green);color:#05261f;font-weight:900}.upload{display:block;border:1px dashed rgba(255,210,117,.65);background:rgba(255,210,117,.07);text-align:center;color:var(--text);cursor:pointer}.upload input{display:none}.preview{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:20px;background:#0a222a;display:block}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%;min-height:47px;border-radius:13px;border:1px solid var(--line);background:#102f39;color:var(--text);padding:10px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:999px;padding:9px 11px}.chip.on{border-color:var(--gold);background:rgba(255,210,117,.1)}.caption{padding:14px;border-radius:15px;background:rgba(255,255,255,.045);line-height:1.6;white-space:pre-wrap}.reward{animation:pop .3s ease;background:radial-gradient(circle at 50% 0,rgba(125,226,187,.18),rgba(13,44,54,.96) 58%)}@keyframes pop{0%{opacity:.2;transform:scale(.97)}100%{opacity:1;transform:none}}canvas{width:100%;border-radius:20px;background:#0a222a;display:block}.gain{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:8px 10px;color:var(--muted)}.pill.on{color:var(--green);border-color:rgba(125,226,187,.5)}.tiny{font-size:11px;color:#789597;text-align:center;line-height:1.5;margin:18px 4px}@media(max-width:440px){h1{font-size:30px}.row{grid-template-columns:1fr}}
</style></head><body><div id="app" class="app"></div><script>
(()=>{const app=document.querySelector('#app');const KEY='rfaV5';let save=(()=>{try{return Object.assign({shares:0,catches:0},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return{shares:0,catches:0}}})();let S={screen:'home',img:null,fish:'翘嘴',size:'',weight:'',place:'本地水域',story:'',style:'brag',caption:'',cardBlob:null};function persist(){localStorage.setItem(KEY,JSON.stringify(save))}function shell(body){app.innerHTML=`<div class="top"><div class="brand"><b>Reality Fishing Adventure</b><small>真实鱼获 → AI战报 → 分享</small></div><button id="home" class="ghost">首页</button></div>${body}<div class="tiny">V5原型：AI识图接口尚未连接服务端，当前用玩家确认 + 本地文案降级。正式版默认隐藏精确GPS。</div>`;document.querySelector('#home').onclick=()=>{S.screen='home';render()}}function home(){shell(`<div class="hero"><span class="kicker">最直接的爽点</span><h1>上鱼了？先晒这一条。</h1><div class="lead">拍一张，系统帮你整理成“鱼获卡 + 朋友圈文案”，同时自动进入个人鱼获记录。</div></div><section class="card gold"><div class="title">📸 AI帮我做战报</div><div class="sub">不用先填日志。先选照片，AI识别和信息确认放到后面。</div><label class="upload">拍照 / 从相册选择<input id="photo" type="file" accept="image/*" capture="environment"></label></section><section class="card"><span class="kicker">你会得到什么</span><div class="gain"><span class="pill on">朋友圈文案</span><span class="pill on">鱼获分享卡</span><span class="pill on">证据图鉴</span><span class="pill on">个人纪录</span></div><div class="sub" style="margin-top:12px">当前已生成 ${save.catches} 条鱼获，分享 ${save.shares} 次。</div></section>`);document.querySelector('#photo').onchange=e=>loadPhoto(e.target.files[0])}
function loadPhoto(file){if(!file)return;const r=new FileReader();r.onload=()=>{S.img=r.result;S.screen='confirm';render()};r.readAsDataURL(file)}
function confirm(){shell(`<section class="card green"><img class="preview" src="${S.img}"><div class="title">照片很好，确认3件事就能晒。</div><div class="sub">正式版这里由多模态AI先给候选；不确定的信息必须由你确认。</div><div class="row"><div class="field"><label>鱼种</label><select id="fish"><option>翘嘴</option><option>鲫鱼</option><option>鲤鱼</option><option>黑鱼</option><option>鲈鱼</option><option>其他</option></select></div><div class="field"><label>水域公开方式</label><select id="place"><option>本地水域</option><option>只显示城市</option><option>隐藏地点</option></select></div></div><div class="row"><div class="field"><label>长度（可空）</label><input id="size" placeholder="如 58 cm"></div><div class="field"><label>重量（可空）</label><input id="weight" placeholder="如 2.3 kg"></div></div><div class="field" style="margin-top:10px"><label>一句故事（可空）</label><input id="story" placeholder="如：空军两小时后换深浅交界破局"></div><button id="next" class="primary">让AI写朋友圈</button></section>`);document.querySelector('#fish').value=S.fish;document.querySelector('#next').onclick=()=>{S.fish=document.querySelector('#fish').value;S.place=document.querySelector('#place').value;S.size=document.querySelector('#size').value.trim();S.weight=document.querySelector('#weight').value.trim();S.story=document.querySelector('#story').value.trim();S.screen='caption';makeCaption();render()}}
function makeCaption(){const stat=[S.size,S.weight].filter(Boolean).join(' · ');const extra=stat?`，${stat}`:'';const story=S.story?`\n${S.story}。`:'';const map={brag:`今天不是来喂蚊子的。🎣\n${S.fish}${extra}，成功上岸。${story}\n鱼情可以不给面子，但照片必须有。`,fun:`本来都准备给“空军”找理由了，结果它先投降了。😂\n${S.fish}${extra}。${story}\n今天的钓鱼佬，嘴角比鱼竿还难压。`,pro:`今日实钓记录｜${S.fish}${extra}\n地点：${S.place}${story}\n一次鱼获不代表规律，下一次继续验证相似条件。`,low:`风景不错，运气也刚好不错。\n${S.fish}${extra}。${story}\n留个纪念，下次再见。`};S.caption=map[S.style]}
function caption(){shell(`<section class="card reward"><span class="kicker">AI朋友圈</span><div class="title">先选你今天想怎么炫。</div><div class="chips">${[['brag','高调炫耀'],['fun','搞笑'],['pro','专业'],['low','低调']].map(([id,t])=>`<button class="chip ${S.style===id?'on':''}" data-style="${id}">${t}</button>`).join('')}</div><div class="caption" style="margin-top:14px">${S.caption}</div><button id="card" class="primary">生成分享卡</button><button id="copy" class="secondary" style="width:100%;margin-top:10px">复制文案</button></section>`);document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{S.style=b.dataset.style;makeCaption();render()});document.querySelector('#copy').onclick=()=>navigator.clipboard?.writeText(S.caption);document.querySelector('#card').onclick=()=>{S.screen='card';render();setTimeout(drawCard,20)}}
function card(){shell(`<section class="card gold"><span class="kicker">CATCH STORY CARD</span><canvas id="cv" width="1080" height="1350"></canvas><button id="share" class="primary">分享到朋友圈 / 其他App</button><button id="again" class="secondary" style="width:100%;margin-top:10px">换一张照片</button></section>`);document.querySelector('#share').onclick=shareCard;document.querySelector('#again').onclick=()=>{S.screen='home';render()}}
function drawCard(){const cv=document.querySelector('#cv'),ctx=cv.getContext('2d'),img=new Image();img.onload=()=>{ctx.fillStyle='#071c24';ctx.fillRect(0,0,1080,1350);const scale=Math.max(1080/img.width,880/img.height),w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(1080-w)/2,0,w,h);const g=ctx.createLinearGradient(0,700,0,1350);g.addColorStop(0,'rgba(7,28,36,0)');g.addColorStop(.35,'rgba(7,28,36,.78)');g.addColorStop(1,'rgba(7,28,36,1)');ctx.fillStyle=g;ctx.fillRect(0,650,1080,700);ctx.fillStyle='#ffd275';ctx.font='700 34px system-ui';ctx.fillText('REAL CATCH',64,920);ctx.fillStyle='#fff';ctx.font='800 72px system-ui';ctx.fillText(S.fish,64,1005);ctx.font='500 34px system-ui';ctx.fillStyle='#d7e7e3';ctx.fillText([S.size,S.weight,S.place].filter(Boolean).join(' · '),64,1065);wrap(ctx,S.caption.replace(/\n/g,' '),64,1140,950,42,2);ctx.font='500 24px system-ui';ctx.fillStyle='#7de2bb';ctx.fillText('Reality Fishing Adventure',64,1300);cv.toBlob(b=>S.cardBlob=b,'image/jpeg',.92)};img.src=S.img}
function wrap(ctx,text,x,y,max,lineH,maxLines){ctx.font='500 30px system-ui';ctx.fillStyle='#eef8f5';let line='',n=0;for(const ch of text){const t=line+ch;if(ctx.measureText(t).width>max){ctx.fillText(line,x,y+n*lineH);n++;line=ch;if(n>=maxLines)return}else line=t}if(n<maxLines)ctx.fillText(line,x,y+n*lineH)}
async function shareCard(){save.catches++;persist();const file=S.cardBlob?new File([S.cardBlob],'catch-story.jpg',{type:'image/jpeg'}):null;try{if(file&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],text:S.caption,title:'我的鱼获'});save.shares++;persist()}else if(navigator.share){await navigator.share({text:S.caption,title:'我的鱼获'});save.shares++;persist()}else{await navigator.clipboard?.writeText(S.caption);alert('当前浏览器不支持系统分享，文案已复制。')}}catch(e){if(e?.name!=='AbortError')alert('分享未完成，可复制文案后手动发送。')}}function render(){({home,confirm,caption,card}[S.screen]||home)()}render()})();
</script></body></html>
