<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071c24"><title>Reality Fishing Adventure V6</title><style>:root{--bg:#061a21;--panel:#0d2c36;--panel2:#153d48;--text:#eff9f6;--muted:#9db7b6;--line:#2b5861;--green:#7de2bb;--gold:#ffd275;--blue:#7fc9ef}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -8%,#184a55 0,#092a34 40%,#061a21 100%);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}.app{max-width:720px;margin:auto;padding:14px 14px 92px}.top{display:flex;justify-content:space-between;align-items:center}.brand b{font-size:15px}.brand small,.sub{color:var(--muted)}.brand small{display:block;font-size:11px;margin-top:2px}.hero{padding:26px 5px 12px}.kicker{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--gold)}h1{font-size:32px;line-height:1.08;margin:8px 0 10px}.lead{color:var(--muted);line-height:1.55}.card{background:rgba(13,44,54,.94);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}.green{border-color:rgba(125,226,187,.5)}.gold{border-color:rgba(255,210,117,.48)}.blue{border-color:rgba(127,201,239,.45)}.title{font-size:21px;line-height:1.3;margin:6px 0}.sub{font-size:14px;line-height:1.5}.primary,.secondary,.big,.style,.event{width:100%;min-height:52px;border-radius:16px;padding:13px 14px;margin-top:10px}.primary{border:0;background:var(--green);color:#05261f;font-weight:900}.secondary,.big,.style,.event{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text)}.big{text-align:left}.big b,.style b{display:block}.big small,.style small{display:block;color:var(--muted);margin-top:4px;line-height:1.4}.quick,.styles,.events,.map{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.quick button{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.04);color:var(--text);padding:14px;text-align:left}.quick b{display:block}.quick small{display:block;color:var(--muted);margin-top:4px}.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:8px 10px;color:var(--muted)}.pill.on{color:var(--green);border-color:rgba(125,226,187,.5)}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(5,24,31,.97);border-top:1px solid rgba(255,255,255,.08);padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:50}.bottom .inner{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.nav{border:0;background:transparent;color:#78999a;min-height:56px;border-radius:14px;font-size:11px;padding:6px 2px}.nav span{display:block;font-size:21px}.nav.on{color:var(--green);background:rgba(125,226,187,.07)}.mission{font-size:25px;line-height:1.2;margin:10px 0}.event span{display:block;font-size:26px}.upload{display:block;border:1px dashed rgba(255,210,117,.65);background:rgba(255,210,117,.07);border-radius:17px;padding:14px;text-align:center;margin-top:12px}.upload input{display:none}.preview{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:18px;background:#0a222a;margin-top:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.field{display:grid;gap:5px}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:#102f39;color:var(--text);padding:9px}.caption{padding:14px;border-radius:15px;background:rgba(255,255,255,.045);line-height:1.6;white-space:pre-wrap;margin-top:12px}.lesson{padding:13px 0;border-bottom:1px solid rgba(255,255,255,.07)}.lesson:last-child{border-bottom:0}.lesson b{display:block}.lesson small{display:block;color:var(--muted);margin-top:5px;line-height:1.45}.node{border:1px solid var(--line);border-radius:16px;padding:12px}.node.on{border-color:var(--gold);background:rgba(255,210,117,.07)}.tiny{font-size:11px;color:#789597;text-align:center;line-height:1.5;margin:18px 4px}@media(max-width:440px){.row,.styles,.map{grid-template-columns:1fr}h1{font-size:29px}}</style></head><body><div id="app" class="app"></div><div id="bottom" class="bottom"></div><script>(()=>{const app=document.querySelector('#app'),bottom=document.querySelector('#bottom'),KEY='rfaV6direct';const base={tab:'home',trips:0,discoveries:0,catches:0,shares:0,knowledge:0,map:{structure:false,edge:false,life:false},dex:{},last:'还没有开始第一次现实任务'};let save=(()=>{try{return Object.assign({},base,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return JSON.parse(JSON.stringify(base))}})();save.map=Object.assign({},base.map,save.map||{});save.dex=save.dex||{};let S={tab:save.tab||'home',screen:'root',mission:'structure',event:null,img:null,shoot:'hero',fish:'翘嘴',place:'隐藏地点',story:'',caption:'',captionStyle:'brag'};const navs=[['home','🏠','首页'],['guide','🎯','跟着我钓'],['photo','📸','拍照晒鱼'],['learn','📚','知识准备'],['me','👤','我的']];function persist(){save.tab=S.tab;localStorage.setItem(KEY,JSON.stringify(save))}function nav(){bottom.innerHTML='<div class="inner">'+navs.map(([id,ic,t])=>`<button class="nav ${S.tab===id?'on':''}" data-nav="${id}"><span>${ic}</span>${t}</button>`).join('')+'</div>';bottom.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.nav;S.screen='root';persist();render()})}function shell(body,title='Reality Fishing Adventure'){app.innerHTML=`<div class="top"><div class="brand"><b>${title}</b><small>真实钓鱼 · 学会判断 · 记录与分享</small></div></div>${body}<div class="tiny">V6直连版：单文件部署，不依赖 GitHub Raw。AI识鱼/在线文案尚未接服务端，当前使用玩家确认 + 本地文案。</div>`;nav()}function home(){shell(`<div class="hero"><span class="kicker">今天想怎么用？</span><h1>需要什么，就点什么。</h1><div class="lead">出门前看准备，到水边让系统带着钓，上鱼后拍帅、写文案、留记录。</div></div><section class="card green"><div class="title">第一次打开？</div><div class="sub">先拿一个现实任务，1分钟内知道先做什么。</div><button class="primary" data-j="guide">🎯 给我一个今天能用的任务</button></section><div class="quick"><button data-j="photo"><b>📸 上鱼了</b><small>拍帅 + 朋友圈</small></button><button data-j="learn"><b>📚 出发前</b><small>3分钟准备</small></button><button data-j="guide"><b>👀 到水边</b><small>找结构/边界/鱼讯</small></button><button data-j="me"><b>🗺️ 看成长</b><small>水域、图鉴、纪录</small></button></div><section class="card"><div class="title">最近</div><div class="sub">${save.last}</div><div class="pillrow"><span class="pill ${save.trips?'on':''}">任务 ${save.trips}</span><span class="pill ${save.discoveries?'on':''}">线索 ${save.discoveries}</span><span class="pill ${save.catches?'on':''}">鱼获 ${save.catches}</span><span class="pill ${save.knowledge?'on':''}">知识 ${save.knowledge}</span></div></section>`);app.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.j;S.screen='root';render()})}function guide(){if(S.screen==='mission')return mission();if(S.screen==='field')return field();if(S.screen==='result')return result();shell(`<div class="hero"><span class="kicker">跟着我钓</span><h1>先完成一个现实任务。</h1><div class="lead">新手先给明确动作，不要求先学完理论。</div></div><section class="card green"><div class="title">推荐：先找“变化”</div><div class="sub">草、石、阴影、深浅、流速，只找最明显的一种。</div><button id="startMission" class="primary">马上开始</button></section><section class="card"><button class="big" data-m="structure"><b>我不知道先往哪下竿</b><small>先找结构变化</small></button><button class="big" data-m="edge"><b>一直没口，要不要换</b><small>先找边界</small></button><button class="big" data-m="life"><b>这里到底有没有活性</b><small>先看生物迹象</small></button></section>`,'跟着我钓');document.querySelector('#startMission').onclick=()=>{S.mission='structure';S.screen='mission';render()};app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mission=b.dataset.m;S.screen='mission';render()})}function mission(){const M={structure:['先沿和周围不一样的岸边结构试8分钟。','找草、石、阴影、突出/凹入，8分钟无反馈就换下一条明显变化。'],edge:['去找一条明显边界，先试8分钟。','优先看水色、流速、深浅、明暗变化。'],life:['先花2分钟只看生命迹象。','小鱼、虫、鸟、炸水、鱼星都算；没有也算信息。']};const x=M[S.mission];shell(`<section class="card gold"><span class="kicker">现实任务</span><div class="mission">${x[0]}</div><div class="sub">${x[1]}</div><button id="go" class="primary">我去试，手机先放下</button></section>`,'跟着我钓');document.querySelector('#go').onclick=()=>{save.trips++;persist();S.screen='field';render()}}function field(){shell(`<section class="card gold"><div class="mission">${S.mission==='structure'?'找变化，再下竿':S.mission==='edge'?'沿边界搜索':'先看有没有生命迹象'}</div><div class="sub">现实发生变化时再回来点一下。</div><div class="events"><button class="event" data-e="bite"><span>⚡</span>有鱼讯</button><button class="event" data-e="catch"><span>🐟</span>上鱼了</button><button class="event" data-e="clue"><span>👀</span>发现线索</button><button class="event" data-e="zero"><span>○</span>这一轮没口</button></div></section>`,'跟着我钓');app.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{S.event=b.dataset.e;if(S.event==='clue'){save.discoveries++;save.map[S.mission]=true}if(S.event==='catch'){save.catches++;save.dex[S.fish]=(save.dex[S.fish]||0)+1}persist();S.screen='result';render()})}function result(){const D=S.event==='catch'?['🐟','命中了','这次行动真的连上了现实鱼获。']:S.event==='bite'?['⚡','有突破','这个方向出现了真实反馈。']:S.event==='clue'?['✨','地图亮了一块','你的个人水域多了一条真实线索。']:['↯','反转也算推进','当前方向应该降温，下一轮换一条明显变化。'];save.last=D[1]+'：'+D[2];persist();shell(`<section class="card green"><div style="font-size:54px;text-align:center">${D[0]}</div><div class="title">${D[1]}</div><div class="sub">${D[2]}</div>${S.event==='catch'?'<button id="toPhoto" class="primary">去拍帅一点，顺便晒鱼</button>':'<button id="again" class="primary">继续下一轮</button>'}</section>`,'跟着我钓');const a=document.querySelector('#again');if(a)a.onclick=()=>{S.screen='root';render()};const p=document.querySelector('#toPhoto');if(p)p.onclick=()=>{S.tab='photo';S.screen='root';render()}}function photo(){if(S.screen==='confirm')return confirmPhoto();if(S.screen==='caption')return captionPage();shell(`<div class="hero"><span class="kicker">拍照晒鱼</span><h1>先拍帅，再炫。</h1><div class="lead">先选风格，系统告诉你怎么站、鱼怎么拿、镜头放哪。</div></div><section class="card gold"><div class="styles">${[['hero','🏆 巨物英雄照','鱼往镜头靠一点，人物稍后'],['low','🌊 低机位水边','摄影者蹲低，鱼保持水平'],['sunset','🌅 夕阳氛围','侧逆光，让鱼身吃到光'],['gear','🎣 装备故事照','鱼+竿轮+水面一起讲故事']].map(([id,t,s])=>`<button class="style" data-s="${id}"><b>${t}</b><small>${s}</small></button>`).join('')}</div></section><section class="card green"><div class="title">${shootTip()}</div><div class="sub">鱼眼清楚、别遮鱼身、背景简洁、手臂稍弯。拍完尽快处理或放流。</div><label class="upload">📸 拍照 / 从相册选择<input id="photo" type="file" accept="image/*" capture="environment"></label></section>`,'拍照晒鱼');app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.shoot=b.dataset.s;render()});document.querySelector('#photo').onchange=e=>loadPhoto(e.target.files[0])}function shootTip(){return{hero:'把鱼往镜头方向送一点，但别伸直手臂。',low:'摄影的人蹲低一点，人物稍侧身。',sunset:'太阳放侧后方，点击鱼身测光。',gear:'让鱼占画面一半，装备只留1—2件。'}[S.shoot]}function loadPhoto(file){if(!file)return;const r=new FileReader();r.onload=()=>{S.img=r.result;S.screen='confirm';render()};r.readAsDataURL(file)}function confirmPhoto(){shell(`<section class="card green"><img class="preview" src="${S.img}"><div class="title">确认一下，就能生成朋友圈。</div><div class="row"><div class="field"><label>鱼种</label><select id="fish"><option>翘嘴</option><option>鲫鱼</option><option>鲤鱼</option><option>黑鱼</option><option>鲈鱼</option><option>其他</option></select></div><div class="field"><label>地点公开</label><select id="place"><option>隐藏地点</option><option>只显示城市</option><option>本地水域</option></select></div></div><div class="field" style="margin-top:10px"><label>一句故事</label><input id="story" placeholder="空军两小时，换边界后破局"></div><button id="next" class="primary">生成朋友圈文案</button></section>`,'拍照晒鱼');document.querySelector('#next').onclick=()=>{S.fish=document.querySelector('#fish').value;S.place=document.querySelector('#place').value;S.story=document.querySelector('#story').value.trim();makeCaption();S.screen='caption';render()}}function makeCaption(){const st=S.story?`\n${S.story}。`:'';const M={brag:`今天不是来喂蚊子的。🎣\n${S.fish}成功上岸。${st}\n鱼情可以不给面子，但照片必须有。`,fun:`本来都准备给空军找理由了，结果它先投降了。😂\n${S.fish}。${st}\n今天的嘴角比鱼竿还难压。`,pro:`今日实钓记录｜${S.fish}\n地点：${S.place}${st}\n一次鱼获不代表规律，下次继续验证。`,low:`风景不错，运气也刚好不错。\n${S.fish}。${st}\n留个纪念，下次再见。`};S.caption=M[S.captionStyle]}function captionPage(){shell(`<section class="card green"><div class="title">今天想怎么炫？</div><div class="pillrow">${[['brag','高调'],['fun','搞笑'],['pro','专业'],['low','低调']].map(([id,t])=>`<button class="secondary" style="width:auto" data-c="${id}">${t}</button>`).join('')}</div><div class="caption">${S.caption}</div><button id="copy" class="primary">复制文案</button><button id="saveCatch" class="secondary" style="width:100%;margin-top:10px">记入我的鱼获</button></section>`,'拍照晒鱼');app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.captionStyle=b.dataset.c;makeCaption();render()});document.querySelector('#copy').onclick=()=>navigator.clipboard?.writeText(S.caption);document.querySelector('#saveCatch').onclick=()=>{save.catches++;save.dex[S.fish]=(save.dex[S.fish]||0)+1;save.last='记录一条真实鱼获：'+S.fish;persist();S.tab='me';S.screen='root';render()}}function learn(){shell(`<div class="hero"><span class="kicker">知识准备</span><h1>需要时再学。</h1></div><section class="card green"><div class="title">出发前3分钟</div><div class="lesson"><b>① 定一个目标</b><small>休闲、探索、目标鱼，准备方式不同。</small></div><div class="lesson"><b>② 先看安全和天气</b><small>雷暴、大风、涨水、夜钓岸边风险优先于鱼情。</small></div><div class="lesson"><b>③ 少带一点，少改一点</b><small>新手最容易同时改太多变量。</small></div><button id="learned" class="primary">记住这3件事</button></section><section class="card"><div class="lesson"><b>怎么看水？</b><small>先找结构、边界、生命迹象。</small></div><div class="lesson"><b>一直没口怎么办？</b><small>位置→水层→呈现，一次只改一个主要变量。</small></div><div class="lesson"><b>鱼上岸后怎么处理？</b><small>先安全控鱼，再快速拍照、测量、处理或放流。</small></div></section>`,'知识准备');document.querySelector('#learned').onclick=()=>{save.knowledge++;save.last='完成一次出钓前准备';persist();alert('已记入你的准备进度')}}function me(){const fishes=Object.entries(save.dex);shell(`<div class="hero"><span class="kicker">我的</span><h1>真实钓鱼履历。</h1></div><section class="card green"><div class="pillrow"><span class="pill on">任务 ${save.trips}</span><span class="pill on">线索 ${save.discoveries}</span><span class="pill on">鱼获 ${save.catches}</span><span class="pill on">知识 ${save.knowledge}</span></div></section><section class="card gold"><div class="title">我的水域</div><div class="map"><div class="node ${save.map.structure?'on':''}"><b>🌿 结构</b><small>${save.map.structure?'已有真实线索':'等待探索'}</small></div><div class="node ${save.map.edge?'on':''}"><b>🌊 边界</b><small>${save.map.edge?'已有真实线索':'等待探索'}</small></div><div class="node ${save.map.life?'on':''}"><b>🐟 生命迹象</b><small>${save.map.life?'已有真实线索':'等待探索'}</small></div></div></section><section class="card"><div class="title">证据图鉴</div>${fishes.length?fishes.map(([f,n])=>`<div class="lesson"><b>🐟 ${f}</b><small>真实确认 ${n} 次</small></div>`).join(''):'<div class="sub">还没有真实鱼获。</div>'}</section>`,'我的')}function render(){nav();if(S.tab==='home')home();else if(S.tab==='guide')guide();else if(S.tab==='photo')photo();else if(S.tab==='learn')learn();else me()}render()})();</script></body></html>
