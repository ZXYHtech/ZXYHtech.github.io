<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071c24">
<title>Reality Fishing Adventure · Beta V2</title>
<style>
:root{--panel:#0d2c37;--panel2:#143b47;--text:#eef8f5;--muted:#9db7b6;--line:#29545e;--green:#7ce2bc;--gold:#ffd47c;--hot:#ff927e;--shadow:0 18px 50px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -8%,#1a4954 0,#092832 38%,#061920 100%);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;touch-action:manipulation}.app{max-width:720px;margin:auto;padding:12px 14px 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.brand b{font-size:15px}.brand small{display:block;color:var(--muted);font-size:11px}.iconbtn{border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--muted);border-radius:999px;min-height:42px;padding:8px 12px}.tabs{display:flex;gap:8px;margin:8px 0 14px}.tabs button{flex:1;min-height:44px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--muted)}.tabs button.on{color:var(--text);border-color:var(--green);background:rgba(124,226,188,.08)}.screen{animation:in .22s ease}@keyframes in{from{opacity:.25;transform:translateY(5px)}to{opacity:1;transform:none}}.hero{padding:25px 5px 12px}.kicker{font-size:11px;letter-spacing:.12em;font-weight:900;color:var(--gold)}h1{font-size:34px;line-height:1.08;margin:8px 0 10px}.lead{color:var(--muted);line-height:1.55}.card{background:rgba(13,44,55,.94);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:var(--shadow)}.card.soft{box-shadow:none;background:rgba(255,255,255,.04)}.mystery{border-color:rgba(255,212,124,.48)}.title{font-size:22px;line-height:1.28;margin:7px 0}.sub{color:var(--muted);font-size:14px;line-height:1.5}.primary,.secondary,.choice,.fieldbtn,.tile{width:100%;border-radius:17px;min-height:54px;padding:14px 15px;margin-top:10px;cursor:pointer}.primary{border:0;background:var(--green);color:#05261e;font-weight:900;text-align:center}.primary:disabled{opacity:.38}.secondary{border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--text)}.choice{border:1px solid transparent;background:var(--panel2);color:var(--text);text-align:left}.choice.on{border-color:var(--green);box-shadow:0 0 0 3px rgba(124,226,188,.08)}.choice b{display:block;font-size:16px}.choice small{display:block;color:var(--muted);margin-top:4px;line-height:1.42}.wagers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.wagers button{min-height:49px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text)}.wagers button.on{border-color:var(--gold);background:rgba(255,212,124,.1)}.targetgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.target{min-height:128px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);padding:14px;text-align:left}.target span{font-size:30px;display:block}.target b{font-size:17px;display:block;margin:8px 0 4px}.target small{color:var(--muted);line-height:1.35}.target.on{border-color:var(--green);background:rgba(124,226,188,.07)}.context{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 9px;color:var(--muted);font-size:12px;background:rgba(255,255,255,.03)}.pill.good{border-color:rgba(124,226,188,.48);color:var(--green)}.field{min-height:510px;position:relative;overflow:hidden;background:linear-gradient(180deg,#1a4b55,#0d3944 52%,#082832);border-radius:25px;padding:18px;border:1px solid #30606a}.field:after{content:"";position:absolute;left:-18%;right:-18%;bottom:-40px;height:225px;background:repeating-radial-gradient(ellipse at 50% 0,rgba(177,241,225,.13) 0 2px,transparent 3px 22px);opacity:.85}.field>*{position:relative;z-index:2}.mission{display:inline-block;border:1px solid rgba(255,212,124,.42);border-radius:999px;padding:7px 10px;font-size:12px;color:var(--gold);background:rgba(0,0,0,.15)}.fieldcopy{margin-top:18px}.fieldcopy b{font-size:25px;display:block}.fieldcopy small{display:block;color:#b7cecd;margin-top:8px;line-height:1.5}.fieldactions{margin-top:125px;display:grid;gap:10px}.fieldbtn{border:1px solid #3a6870;background:rgba(6,29,37,.82);color:var(--text);text-align:left}.fieldbtn strong{font-size:17px}.fieldbtn span{float:right;font-size:23px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.tile{margin:0;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);min-height:92px;text-align:center}.tile span{display:block;font-size:28px;margin-bottom:5px}.reveal{animation:pop .32s ease;background:radial-gradient(circle at 50% 0,rgba(124,226,188,.18),rgba(13,44,55,.96) 56%);border-color:rgba(124,226,188,.68)}.flip{border-color:rgba(255,146,126,.76);background:radial-gradient(circle at 50% 0,rgba(255,146,126,.18),rgba(13,44,55,.96) 58%)}@keyframes pop{0%{transform:scale(.965);opacity:.3}100%{transform:none;opacity:1}}.burst{text-align:center;font-size:58px;margin:6px 0 11px;animation:bloom .58s ease}@keyframes bloom{0%{transform:scale(.4);opacity:0}65%{transform:scale(1.17)}100%{transform:scale(1)}}.story{display:grid;gap:8px;margin-top:15px}.story div{padding:12px;border-radius:14px;background:rgba(255,255,255,.045);font-size:14px}.story b{color:var(--green)}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.zone{min-height:105px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.035);padding:12px}.zone b{display:block}.zone small{display:block;color:var(--muted);margin-top:6px}.zone.known{border-color:rgba(124,226,188,.48)}.zone.hot{border-color:var(--gold);background:rgba(255,212,124,.07)}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{border:1px solid var(--line);border-radius:999px;padding:8px 10px;color:var(--muted);font-size:12px}.badge.on{border-color:var(--green);color:var(--green);background:rgba(124,226,188,.07)}.dexrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}.dexrow:last-child{border-bottom:0}.fishicon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.05);font-size:27px}.dexrow b{display:block}.dexrow small{display:block;color:var(--muted);margin-top:3px}.toast{position:sticky;bottom:12px;margin:12px auto 0;background:#10323c;border:1px solid var(--green);border-radius:14px;padding:12px 14px;display:none;box-shadow:var(--shadow)}.toast.show{display:block;animation:pop .18s ease}.tiny{font-size:11px;color:#789596;text-align:center;margin:18px 4px;line-height:1.5}@media(max-width:470px){h1{font-size:30px}.targetgrid,.map{grid-template-columns:1fr}.field{min-height:475px}.fieldactions{margin-top:95px}.wagers{grid-template-columns:1fr}}
</style>
</head>
<body><div class="app" id="app"></div>
<script src="./content-v1.js"></script>
<script>
(()=>{
const C=window.REALITY_FISH_CONTENT,app=document.querySelector('#app'),KEY='realityFishingBetaV2';
const base={activeTarget:'chub',trips:0,discoveries:0,landed:0,zeros:0,knownZones:['reed'],badges:[],dex:{},mysteryIndex:{chub:0,crucian:0,carp:0},lastStory:{}};
let save=load();
const S={screen:'home',bet:null,wager:null,challenge:null,clue:null,event:null,zone:'reed',round:1,next:null};
const wagers={probe:'试探',lean:'看好',heavy:'重押'};
function load(){try{return Object.assign({},base,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return {...base}}}
function persist(){localStorage.setItem(KEY,JSON.stringify(save))}
function target(){return C.targets[save.activeTarget]}
function mystery(){const t=target(),i=(save.mysteryIndex[save.activeTarget]||0)%t.mysteries.length;return t.mysteries[i]}
function waterbody(){return C.waterbodies[target().waterbody]}
function tone(f=520,d=.07){try{const A=tone.a||(tone.a=new(window.AudioContext||window.webkitAudioContext)()),o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.setValueAtTime(.025,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(g).connect(A.destination);o.start();o.stop(A.currentTime+d)}catch{}}
function buzz(a=[700,900]){a.forEach((f,i)=>setTimeout(()=>tone(f,.08),i*85))}
function resetRun(){Object.assign(S,{screen:'home',bet:null,wager:null,challenge:null,clue:null,event:null,zone:'reed',round:1,next:null})}
function shell(body,tab='play'){app.innerHTML=`<div class="top"><div class="brand"><b>Reality Fishing Adventure</b><small>现实是地图 · 每一竿都是验证</small></div><button id="reset" class="iconbtn">清空演示</button></div><div class="tabs"><button data-tab="play" class="${tab==='play'?'on':''}">探索</button><button data-tab="world" class="${tab==='world'?'on':''}">我的水域</button><button data-tab="dex" class="${tab==='dex'?'on':''}">证据图鉴</button></div><main class="screen">${body}</main><div id="toast" class="toast"></div><div class="tiny">Beta V2：不预测现实鱼情；环境/规则数据目前仍为交互样例。正式实地任务前必须接 Safety Gate 与 AI_book Rule IR。</div>`;document.querySelector('#reset').onclick=()=>{if(confirm('清空本机 Beta V2 进度？')){localStorage.removeItem(KEY);save={...base,dex:{},knownZones:['reed'],badges:[],mysteryIndex:{chub:0,crucian:0,carp:0},lastStory:{}};resetRun();render()}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.screen=b.dataset.tab==='world'?'world':b.dataset.tab==='dex'?'dex':'home';render()})}
function toast(t){const x=document.querySelector('#toast');if(!x)return;x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1400)}
function home(){const t=target(),m=mystery(),wb=waterbody();shell(`<div class="hero"><span class="kicker">NEXT MYSTERY · ${t.icon} ${t.name}</span><h1>${m.title}</h1><div class="lead">${save.lastStory[save.activeTarget]||'第一次面对这个目标鱼：先押判断，再让现实回答。'}</div></div><section class="card mystery"><div class="title">${wb.name}</div><div class="context">${m.context.map(x=>`<span class="pill">${x}</span>`).join('')}<span class="pill good">安全门：演示模式</span></div><button id="start" class="primary">继续这个谜</button><button id="target" class="secondary">换目标鱼</button></section><section class="card soft"><span class="kicker">真实成长</span><div class="badges"><span class="badge ${save.trips?'on':''}">探索 ${save.trips}</span><span class="badge ${save.discoveries?'on':''}">发现 ${save.discoveries}</span><span class="badge ${save.landed?'on':''}">上鱼 ${save.landed}</span><span class="badge ${save.zeros?'on':''}">有效空军 ${save.zeros}</span></div></section>`);document.querySelector('#start').onclick=()=>{tone(650);S.screen='bet';render()};document.querySelector('#target').onclick=()=>{S.screen='targets';render()}}
function targets(){shell(`<section class="card"><span class="kicker">选择今天的目标</span><div class="title">不同目标鱼，谜题也不同。</div><div class="targetgrid">${Object.entries(C.targets).map(([id,t])=>`<button class="target ${save.activeTarget===id?'on':''}" data-target="${id}"><span>${t.icon}</span><b>${t.name}</b><small>${t.mysteries[(save.mysteryIndex[id]||0)%t.mysteries.length].title}</small></button>`).join('')}</div></section><button id="back" class="secondary">返回</button>`);document.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{save.activeTarget=b.dataset.target;persist();resetRun();tone(700);render()});document.querySelector('#back').onclick=()=>{S.screen='home';render()}}
function bet(){const m=mystery();shell(`<section class="card"><span class="kicker">押一个判断</span><div class="title">你更怀疑哪个？</div>${m.hypotheses.map(h=>`<button data-b="${h.id}" class="choice ${S.bet===h.id?'on':''}"><b>${h.label}</b><small>${h.why}</small></button>`).join('')}<div class="wagers">${[['probe','试探一下'],['lean','我看好'],['heavy','我敢重押']].map(([id,x])=>`<button data-w="${id}" class="${S.wager===id?'on':''}">${x}</button>`).join('')}</div></section><button id="lock" class="primary" ${S.bet&&S.wager?'':'disabled'}>押定，让系统发挑战</button>`);document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{S.bet=b.dataset.b;tone(480,.04);render()});document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{S.wager=b.dataset.w;tone(620,.04);render()});document.querySelector('#lock').onclick=()=>{if(!S.bet||!S.wager)return;const h=m.hypotheses.find(x=>x.id===S.bet);S.challenge=h.quest;S.screen='challenge';buzz([620,760]);render()}}
function challenge(){const h=mystery().hypotheses.find(x=>x.id===S.bet);shell(`<section class="card reveal"><div class="burst">🎯</div><span class="kicker">REAL-WORLD QUEST</span><div class="title">${S.challenge}</div><div class="sub">你押“${h.label}” · ${wagers[S.wager]}。挑战结束前不要同时乱改多个主要变量。</div></section><button id="go" class="primary">开始，手机先放下</button>`);document.querySelector('#go').onclick=()=>{S.screen='field';tone(770);render()}}
function field(){const wb=waterbody();shell(`<section class="field"><span class="mission">第 ${S.round} 轮 · ${wb.zones[S.zone].name}</span><div class="fieldcopy"><b>现在去钓。</b><small>${S.challenge}<br>现实发生值得改变判断的事，再拿起手机。</small></div><div class="fieldactions"><button id="clue" class="fieldbtn"><strong>新线索</strong><span>👀</span></button><button id="event" class="fieldbtn"><strong>有鱼讯</strong><span>⚡</span></button><button id="zero" class="fieldbtn"><strong>这一轮结束</strong><span>○</span></button></div></section><button id="end" class="secondary">今天先结束</button>`);document.querySelector('#clue').onclick=()=>{S.screen='clue';render()};document.querySelector('#event').onclick=()=>{S.screen='event';render()};document.querySelector('#zero').onclick=()=>{S.event='zero';S.screen='reveal';tone(330);render()};document.querySelector('#end').onclick=()=>{S.screen='finish';render()}}
function clue(){shell(`<section class="card"><span class="kicker">只记真正改变判断的线索</span><div class="title">刚刚发生了什么？</div><div class="grid">${C.clueTypes.map(x=>`<button class="tile" data-clue="${x.id}"><span>${x.icon}</span>${x.label}</button>`).join('')}</div></section>`);document.querySelectorAll('[data-clue]').forEach(b=>b.onclick=()=>{const x=C.clueTypes.find(v=>v.id===b.dataset.clue);S.clue=x.label;save.discoveries++;if(x.id==='newspot'&&!save.knownZones.includes('drop'))save.knownZones.push('drop');persist();S.round++;S.screen='field';render();setTimeout(()=>toast(`🔎 ${x.label}：已进入当前谜题`),40)})}
function event(){shell(`<section class="card"><span class="kicker">现实事件</span><div class="title">发生哪一种？</div><div class="grid">${C.evidenceEvents.filter(x=>x.id!=='zero').map(x=>`<button class="tile" data-event="${x.id}"><span>${x.icon}</span>${x.label}</button>`).join('')}</div></section>`);document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{S.event=b.dataset.event;if(S.event==='landed')buzz([720,880,1040]);S.screen='reveal';render()})}
function reveal(){const h=mystery().hypotheses.find(x=>x.id===S.bet),ev=C.evidenceEvents.find(x=>x.id===S.event)||C.evidenceEvents.find(x=>x.id==='zero');let title='谜题推进了。',copy='现实证据正在改变你的判断。',next='继续原挑战',flip=false;if(S.event==='zero'){flip=S.wager==='heavy';title=flip?'反转：重押没有得到支持。':'没鱼讯，但不是白钓。';copy='原判断需要降温，但不能因此证明这里没鱼。';next='换一个主要变量继续查';save.zeros++;if(!save.badges.includes('zero'))save.badges.push('zero')}else if(S.event==='follow'){title='关键突破：至少有鱼在响应。';copy='问题从“有没有鱼”收窄到“为什么不攻击”。';next='优先查速度或呈现'}else if(S.event==='bite'){title='真实咬口出现。';copy='原方向得到支持，但一次事件还不是规律。';next='保持主要条件，再复现一次'}else if(S.event==='hookup'){title='转化链又推进一层。';copy='现在可以少怀疑 Presence，多看转化。';next='继续验证能否稳定 Hook-up'}else if(S.event==='landed'){title='现实验证命中。';copy='你押的判断、挑战和真实上鱼连成了一条 Evidence Chain。';next='找相似条件复现一次';save.landed++;save.dex[save.activeTarget]=(save.dex[save.activeTarget]||0)+1;if(!save.badges.includes('landed'))save.badges.push('landed')}else if(S.event==='lost'){title='鱼已经找到了，谜题换层。';copy='现在更值得查转化，而不是继续怀疑这里完全没鱼。';next='保持位置，查转化'}persist();S.next=next;shell(`<section class="card reveal ${flip?'flip':''}"><div class="burst">${flip?'↯':ev.icon}</div><span class="kicker">${flip?'剧情反转':'EVIDENCE REVEAL'}</span><div class="title">${title}</div><div class="sub">${copy}</div><div class="story"><div>你押：<b>${h.label}</b> · ${wagers[S.wager]}</div><div>现实：<b>${ev.label}</b></div><div>下一步：<b>${next}</b></div></div></section><button id="continue" class="primary">${S.event==='landed'?'收下这次发现':'继续解谜'}</button><button id="end" class="secondary">今天先结束</button>`);document.querySelector('#continue').onclick=()=>{if(S.event==='landed'){S.screen='catch'}else{S.round++;S.event=null;S.screen='field'};render()};document.querySelector('#end').onclick=()=>{S.screen='finish';render()}}
function catchScreen(){const t=target();shell(`<section class="card reveal"><div class="burst">${t.icon}</div><span class="kicker">REAL CATCH · EVIDENCE DEX</span><div class="title">${t.name}：新增一条真实证据</div><div class="sub">真实确认才进入图鉴；下一阶段不是刷数量，而是复现、情境和行为证据。</div></section><button id="more" class="primary">继续钓</button><button id="end" class="secondary">今天结束</button>`);document.querySelector('#more').onclick=()=>{S.round++;S.event=null;S.screen='field';render()};document.querySelector('#end').onclick=()=>{S.screen='finish';render()}}
function finish(){const id=save.activeTarget,t=target();save.trips++;save.lastStory[id]=S.event==='zero'?'一个原判断被现实降温。':S.event==='landed'?'一次判断获得现实支持，但还需要复现。':S.clue?`发现“${S.clue}”，下次继续查。`:'留下一个尚未解完的问题。';if(S.event==='landed'||S.event==='zero')save.mysteryIndex[id]=(save.mysteryIndex[id]+1)%t.mysteries.length;if(!save.badges.includes('trip'))save.badges.push('trip');persist();const nm=mystery();shell(`<div class="hero"><span class="kicker">PERSONAL WORLD UPDATED</span><h1>今天把现实水域解开了一点。</h1></div><section class="card mystery"><span class="kicker">NEXT MYSTERY · ${t.icon} ${t.name}</span><div class="title">${nm.title}</div><div class="sub">${save.lastStory[id]}</div></section><button id="world" class="primary">看看我的水域</button>`);document.querySelector('#world').onclick=()=>{S.screen='world';render()}}
function world(){const wb=waterbody();shell(`<div class="hero"><span class="kicker">MY WATERBODY</span><h1>${wb.name}</h1><div class="lead">这是你自己逐次验证出来的私人世界，不是公共神点地图。</div></div><section class="card"><div class="map">${Object.entries(wb.zones).map(([id,z])=>`<div class="zone ${save.knownZones.includes(id)?'known':''} ${S.zone===id?'hot':''}"><b>${z.name}</b><small>${save.knownZones.includes(id)?z.hint:'仍然未知'}</small></div>`).join('')}</div></section><section class="card soft"><span class="kicker">MASTERY</span><div class="badges"><span class="badge ${save.badges.includes('trip')?'on':''}">完整探索</span><span class="badge ${save.badges.includes('zero')?'on':''}">会接受反证</span><span class="badge ${save.badges.includes('landed')?'on':''}">现实验证命中</span></div></section>`,`world`)}
function dex(){shell(`<div class="hero"><span class="kicker">EVIDENCE DEX</span><h1>理解，不是收集数量。</h1></div><section class="card">${Object.entries(C.targets).map(([id,t])=>`<div class="dexrow"><div class="fishicon">${t.icon}</div><div><b>${t.name}</b><small>${save.dex[id]?`真实确认 ${save.dex[id]} 次 · 下一步：复现与更多情境`:'尚无你的真实证据'}</small></div></div>`).join('')}</section>`,`dex`)}
function render(){({home,targets,bet,challenge,field,clue,event,reveal,catch:catchScreen,finish,world,dex}[S.screen]||home)()}
render();
})();
</script>
</body>
</html>
