<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081d26">
<title>Reality Fishing Adventure · Player Beta V3</title>
<style>
:root{--bg:#071b23;--panel:#0d2d38;--panel2:#153c48;--text:#eff9f6;--muted:#9fb9b7;--line:#2b5861;--green:#7ce4bc;--gold:#ffd27a;--hot:#ff9a86;--blue:#84cfee}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#1b4b56,#092832 40%,#061920);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}button{font:inherit;touch-action:manipulation}.app{max-width:720px;margin:auto;padding:14px 14px 42px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand b{font-size:15px}.brand small{display:block;font-size:11px;color:var(--muted);margin-top:2px}.ghost{border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--muted);border-radius:999px;padding:8px 11px;min-height:42px}.hero{padding:28px 4px 12px}.kicker{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--gold)}h1{font-size:34px;line-height:1.08;margin:9px 0 11px}.lead{color:var(--muted);line-height:1.58}.card{background:rgba(13,45,56,.95);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}.title{font-size:22px;line-height:1.3;margin:7px 0}.sub{font-size:14px;color:var(--muted);line-height:1.5}.primary,.choice,.fieldbtn,.tile{width:100%;border-radius:17px;min-height:54px;padding:14px 15px;margin-top:10px;cursor:pointer}.primary{border:0;background:var(--green);color:#05251e;font-weight:900}.secondary{width:100%;min-height:50px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.035);color:var(--text);padding:12px 14px;margin-top:10px}.choice{border:1px solid transparent;background:var(--panel2);color:var(--text);text-align:left}.choice.on{border-color:var(--green)}.choice b{display:block;font-size:16px}.choice small{display:block;color:var(--muted);margin-top:5px;line-height:1.4}.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.how div{border:1px solid var(--line);border-radius:16px;padding:13px;background:rgba(255,255,255,.035)}.how span{font-size:24px}.how b{display:block;margin-top:6px}.how small{display:block;color:var(--muted);margin-top:4px}.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.mode{border:1px solid var(--line);border-radius:18px;padding:15px;background:rgba(255,255,255,.04);color:var(--text);text-align:left;min-height:144px}.mode span{font-size:28px}.mode b{display:block;font-size:17px;margin-top:8px}.mode small{display:block;color:var(--muted);line-height:1.45;margin-top:5px}.mode.recommended{border-color:var(--green);background:rgba(124,228,188,.07)}.mode .tag{font-size:10px;color:var(--green);margin-top:8px}.field{min-height:520px;position:relative;overflow:hidden;background:linear-gradient(180deg,#1a4c56,#0e3b46 50%,#082933);border-radius:25px;padding:18px;border:1px solid #31636d}.field:after{content:"";position:absolute;left:-20%;right:-20%;bottom:-45px;height:230px;background:repeating-radial-gradient(ellipse at 50% 0,rgba(180,244,228,.13) 0 2px,transparent 3px 22px)}.field>*{position:relative;z-index:1}.mission{display:inline-block;border:1px solid rgba(255,210,122,.45);border-radius:999px;padding:7px 10px;font-size:12px;color:var(--gold);background:rgba(0,0,0,.15)}.fieldcopy{margin-top:18px}.fieldcopy b{display:block;font-size:25px;line-height:1.2}.fieldcopy small{display:block;color:#b8cfcd;line-height:1.5;margin-top:8px}.fieldactions{margin-top:125px;display:grid;gap:10px}.fieldbtn{border:1px solid #3c6a72;background:rgba(6,29,37,.83);color:var(--text);text-align:left}.fieldbtn strong{font-size:17px}.fieldbtn span{float:right;font-size:23px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.tile{margin:0;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);min-height:92px}.tile span{display:block;font-size:27px;margin-bottom:4px}.reveal{background:radial-gradient(circle at 50% 0,rgba(124,228,188,.18),rgba(13,45,56,.96) 56%);border-color:rgba(124,228,188,.66);animation:pop .28s ease}.flip{background:radial-gradient(circle at 50% 0,rgba(255,154,134,.17),rgba(13,45,56,.96) 58%);border-color:rgba(255,154,134,.72)}@keyframes pop{from{transform:scale(.965);opacity:.25}to{transform:none;opacity:1}}.burst{text-align:center;font-size:56px;margin:4px 0 10px}.story{display:grid;gap:8px;margin-top:14px}.story div{padding:11px 12px;border-radius:13px;background:rgba(255,255,255,.045);font-size:14px}.story b{color:var(--green)}.world{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.zone{border:1px solid var(--line);border-radius:16px;padding:12px;min-height:100px;background:rgba(255,255,255,.035)}.zone.on{border-color:var(--green)}.zone b{display:block}.zone small{display:block;color:var(--muted);margin-top:5px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:12px}.badge.on{color:var(--green);border-color:var(--green)}.tip{border-left:3px solid var(--gold);padding:11px 13px;background:rgba(255,210,122,.07);border-radius:0 13px 13px 0;margin:12px 0;line-height:1.5}.tiny{font-size:11px;color:#789596;text-align:center;margin:18px 4px}@media(max-width:470px){h1{font-size:30px}.how,.modegrid,.world{grid-template-columns:1fr}.field{min-height:485px}.fieldactions{margin-top:100px}}
</style>
</head>
<body><div class="app" id="app"></div>
<script>
(()=>{
const app=document.querySelector('#app');const KEY='rfaPlayerBetaV3';const fresh={mode:null,trips:0,finds:0,catches:0,zones:['shore'],last:'第一次任务还没开始。'};let save=load();const S={screen:save.mode?'home':'onboard',mode:save.mode,plan:null,event:null,round:1};const modeData={newbie:{icon:'🧭',name:'带我钓',for:'第一次玩 / 不想研究',promise:'系统直接告诉你下一步做什么。',mission:'先找一个和周围明显不一样的地方：草边、桥墩、深浅交界都可以。'},casual:{icon:'🌿',name:'去探索',for:'休闲 / 喜欢发现',promise:'少分析，多探索、收集和解锁。',mission:'今天只完成一件事：发现一个以前没认真观察过的位置。'},learner:{icon:'🕵️',name:'练判断',for:'想提高钓技',promise:'先猜，再用真实结果验证。',mission:'先判断：鱼更可能在浅处、深浅交界，还是“在但不肯追”？'},expert:{icon:'🧪',name:'自由研究',for:'常钓 / 想深挖',promise:'自己选变量，系统帮你保存证据链。',mission:'选择一个变量：位置 / 水层 / 速度 / 呈现，只改这一项。'}};
function load(){try{return Object.assign({},fresh,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return {...fresh}}}function persist(){localStorage.setItem(KEY,JSON.stringify(save))}function tone(f=600,d=.06){try{const A=tone.a||(tone.a=new(window.AudioContext||window.webkitAudioContext)()),o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.setValueAtTime(.02,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(g).connect(A.destination);o.start();o.stop(A.currentTime+d)}catch{}}function top(){return `<div class="top"><div class="brand"><b>Reality Fishing Adventure</b><small>现实是地图，真实结果推动游戏</small></div>${save.mode?'<button id="switch" class="ghost">换玩法</button>':''}</div>`}function shell(body){app.innerHTML=top()+`<main>${body}</main><div class="tiny">试玩版使用演示任务；正式版将接入真实水域、天气、鱼种知识与个人历史。</div>`;const sw=document.querySelector('#switch');if(sw)sw.onclick=()=>{S.screen='onboard';render()}}
function onboard(){shell(`<div class="hero"><span class="kicker">先别学规则</span><h1>你只要记住 3 件事。</h1><div class="how"><div><span>1️⃣</span><b>选玩法</b><small>系统按你的习惯简化游戏。</small></div><div><span>2️⃣</span><b>去真实钓</b><small>屏幕只给一句当前任务。</small></div><div><span>3️⃣</span><b>回来点一下</b><small>有变化、鱼讯或没动静都能推进。</small></div></div></div><section class="card"><span class="kicker">你今天想怎么玩？</span><div class="modegrid">${Object.entries(modeData).map(([id,m])=>`<button class="mode ${id==='newbie'?'recommended':''}" data-mode="${id}"><span>${m.icon}</span><b>${m.name}</b><small>${m.for}<br>${m.promise}</small>${id==='newbie'?'<div class="tag">第一次建议选这个</div>':''}</button>`).join('')}</div></section>`);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;save.mode=S.mode;persist();tone(720);S.screen='home';render()})}
function home(){const m=modeData[S.mode];shell(`<div class="hero"><span class="kicker">${m.icon} ${m.name}</span><h1>${S.mode==='newbie'?'今天不用研究，照着做就行。':S.mode==='casual'?'今天去解锁一个真实发现。':S.mode==='learner'?'今天练一个判断。':'今天做一个干净的小实验。'}</h1><div class="lead">${m.promise}</div></div><section class="card"><div class="title">怎么玩？</div><div class="story"><div>① 看一句任务</div><div>② 放下手机去真实钓</div><div>③ 有变化时回来点一下</div></div><button id="go" class="primary">给我今天的第一个任务</button></section><section class="card"><span class="kicker">我的进度</span><div class="badges"><span class="badge ${save.trips?'on':''}">出钓 ${save.trips}</span><span class="badge ${save.finds?'on':''}">发现 ${save.finds}</span><span class="badge ${save.catches?'on':''}">上鱼 ${save.catches}</span></div><div class="sub" style="margin-top:10px">上次：${save.last}</div></section>`);document.querySelector('#go').onclick=()=>{tone();S.screen=(S.mode==='learner'||S.mode==='expert')?'plan':'mission';render()}}
function plan(){if(S.mode==='learner'){const opts=[['shallow','我觉得鱼在浅处'],['drop','我觉得鱼在深浅交界'],['response','我觉得鱼在，但不肯追']];shell(`<section class="card"><span class="kicker">先猜一下</span><div class="title">你更倾向哪个？</div><div class="sub">没有考试，只是先留下你的判断。</div>${opts.map(([id,t])=>`<button class="choice ${S.plan===id?'on':''}" data-p="${id}"><b>${t}</b></button>`).join('')}</section><button id="next" class="primary" ${S.plan?'':'disabled'}>好了，去验证</button>`)}else{const opts=[['位置','只换位置'],['水层','只换水层'],['速度','只改速度'],['呈现','只改动作/轮廓']];shell(`<section class="card"><span class="kicker">选择变量</span><div class="title">这一轮只改哪一项？</div>${opts.map(([id,t])=>`<button class="choice ${S.plan===id?'on':''}" data-p="${id}"><b>${t}</b><small>其他主要条件尽量不动</small></button>`).join('')}</section><button id="next" class="primary" ${S.plan?'':'disabled'}>开始这一轮</button>`)}document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.plan=b.dataset.p;tone(520);render()});document.querySelector('#next').onclick=()=>{if(!S.plan)return;S.screen='mission';render()}}
function mission(){const m=modeData[S.mode];let mission=m.mission;if(S.mode==='learner')mission=S.plan==='shallow'?'先在浅区试一轮，别同时乱改其他东西。':S.plan==='drop'?'去深浅交界试一轮，其他条件尽量不动。':'位置先不换，只改变一次收饵方式。';if(S.mode==='expert')mission=`这一轮只改「${S.plan}」，其他主要条件尽量不动。`;shell(`<section class="card reveal"><div class="burst">🎯</div><span class="kicker">现在只做这一件事</span><div class="title">${mission}</div><div class="sub">不用填表。做完、发现变化或有鱼讯时再回来。</div></section><button id="field" class="primary">明白，去钓</button>`);document.querySelector('#field').onclick=()=>{tone(760);S.screen='field';render()}}
function field(){const m=modeData[S.mode];let line='照任务做就行，不需要分析。';if(S.mode==='casual')line='看到新地方、新鱼讯、新生物迹象都算发现。';if(S.mode==='learner')line='现实结果会告诉你刚才的判断值不值得继续。';if(S.mode==='expert')line=`当前只改：${S.plan}。`;shell(`<section class="field"><span class="mission">${m.icon} ${m.name} · 第 ${S.round} 轮</span><div class="fieldcopy"><b>手机先放下，去真实钓。</b><small>${line}</small></div><div class="fieldactions"><button id="find" class="fieldbtn"><strong>${S.mode==='newbie'?'我看到明显变化':'发现新线索'}</strong><span>👀</span></button><button id="fish" class="fieldbtn"><strong>有鱼讯 / 上鱼</strong><span>⚡</span></button><button id="quiet" class="fieldbtn"><strong>还是没动静</strong><span>○</span></button></div></section><button id="end" class="secondary">今天到这里</button>`);document.querySelector('#find').onclick=()=>{S.screen='find';render()};document.querySelector('#fish').onclick=()=>{S.screen='fish';render()};document.querySelector('#quiet').onclick=()=>{S.event='quiet';S.screen='result';render()};document.querySelector('#end').onclick=()=>{S.event='end';S.screen='finish';render()}}
function find(){const xs=S.mode==='casual'?[['📍','新位置'],['🐟','看到鱼/饵鱼'],['🌊','水流变化'],['🌿','新结构']]:[['🌿','草/障碍'],['📉','深浅变化'],['🐟','鱼/饵鱼迹象'],['🌊','水或流变了']];shell(`<section class="card"><span class="kicker">点一下就够</span><div class="title">你看到了什么？</div><div class="grid">${xs.map(([i,t])=>`<button class="tile" data-e="${t}"><span>${i}</span>${t}</button>`).join('')}</div></section>`);document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{S.event=b.dataset.e;save.finds++;if(!save.zones.includes('drop')&&(S.event.includes('深浅')||S.event==='新位置'))save.zones.push('drop');persist();S.screen='result';render()})}
function fish(){const xs=[['👀','看到追随'],['🎣','有咬口'],['🐟','上鱼了'],['💨','跑鱼了']];shell(`<section class="card"><span class="kicker">发生了什么？</span><div class="grid">${xs.map(([i,t])=>`<button class="tile" data-e="${t}"><span>${i}</span>${t}</button>`).join('')}</div></section>`);document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{S.event=b.dataset.e;if(S.event==='上鱼了')save.catches++;persist();S.screen='result';render()})}
function result(){let icon='🔎',title='有新发现。',copy='这条信息已经进入你的水域记忆。',next='继续当前任务';let flip=false;if(S.event==='quiet'){icon='↯';title=S.mode==='newbie'?'没动静？那就换一步，不算失败。':'这个方向暂时没得到支持。';copy=S.mode==='newbie'?'系统帮你把范围缩小：下一轮换一个明显不同的位置。':'无反馈也是信息，不需要硬把它解释成“这里没鱼”。';next='下一轮换一个明显不同的位置';flip=true}else if(S.event==='上鱼了'){icon='🐟';title='命中了一个真实结果。';copy=S.mode==='casual'?'你的水域收藏多了一条真实发现。':'这次方向得到支持，但以后还要看看能不能复现。';next='保留这个发现，下次相似条件再试'}else if(S.event==='看到追随'||S.event==='有咬口'||S.event==='跑鱼了'){icon='⚡';title='局势推进了。';copy='至少已经不是“完全没有反应”，下一步问题变得更小。';next='先别急着大换位置，继续查响应'}else{next=S.mode==='casual'?'再找一个不同的地方':'先在这里试一轮，看看有没有鱼讯'}shell(`<section class="card reveal ${flip?'flip':''}"><div class="burst">${icon}</div><span class="kicker">${S.mode==='newbie'?'系统帮你解释':'这次发生了什么'}</span><div class="title">${title}</div><div class="sub">${copy}</div><div class="tip"><b>下一步：</b>${next}</div></section><button id="again" class="primary">继续这一趟</button><button id="end" class="secondary">今天结束</button>`);document.querySelector('#again').onclick=()=>{S.round++;S.event=null;S.screen='field';render()};document.querySelector('#end').onclick=()=>{S.screen='finish';render()}}
function finish(){save.trips++;save.last=S.event==='上鱼了'?'一次真实上鱼被保存。':S.event==='quiet'?'一个方向没得到支持，下次换位置继续。':S.event&&S.event!=='end'?`发现了「${S.event}」。`:'留下了一个下次继续的问题。';persist();shell(`<div class="hero"><span class="kicker">今天结束</span><h1>不用写总结，游戏已经替你留下下一步。</h1></div><section class="card"><div class="title">${save.last}</div><div class="sub">下次打开会从这里继续，而不是重新填一套表。</div></section><section class="card"><span class="kicker">水域成长</span><div class="world"><div class="zone on"><b>岸边区域</b><small>已探索</small></div><div class="zone ${save.zones.includes('drop')?'on':''}"><b>深浅交界</b><small>${save.zones.includes('drop')?'已发现':'待发现'}</small></div><div class="zone"><b>更多区域</b><small>下一次继续解锁</small></div></div></section><button id="home" class="primary">回到首页</button>`);document.querySelector('#home').onclick=()=>{S.plan=null;S.event=null;S.round=1;S.screen='home';render()}}
function render(){({onboard,home,plan,mission,field,find,fish,result,finish}[S.screen]||onboard)()}render();})();
</script>
</body></html>
