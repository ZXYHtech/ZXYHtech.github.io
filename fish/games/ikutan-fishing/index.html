<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#123a55"><title>Fishing Game · ikutan7 MIT Adaptation</title><link rel="stylesheet" href="style.css"><style>html,body{min-height:100%;margin:0}body{padding:18px 14px 130px;overflow-y:auto}.source{position:fixed;right:8px;top:8px;font-size:10px;opacity:.55}.heroemoji{font-size:54px;margin:8px}.menu-bttn{min-height:50px;font-size:16px;font-weight:800}.gamepanel{max-width:640px;margin:auto}.baitrow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.hint{font-size:12px;opacity:.75}.action-btn{min-width:72px;min-height:44px;touch-action:manipulation}#shakeArea,#reelChallenge{position:relative;min-height:210px;max-width:620px;margin:10px auto;border-radius:18px;background:rgba(255,255,255,.22);overflow:hidden}#reelChallenge{min-height:280px}#timerBar{max-width:620px;margin:10px auto}.fish{z-index:0}.source a{color:inherit}</style></head><body><div class="source">MIT · ikutan7</div><div class="gamepanel"><div class="heroemoji">🎣🐟</div><div id="clockDisplay">06:00</div><h1>Fishing Game</h1><p>选饵、抛竿、等鱼口，然后把出现的 Reel! 按钮点完。</p><button id="castBtn" class="menu-bttn" onclick="castLine()">🎣 Cast Line / 抛竿</button><button class="menu-bttn" onclick="showSummary()">📖 我的鱼获</button><div class="baitrow"><label for="baitSelect">饵：</label><select id="baitSelect" onchange="updateBait()"><option value="Worm">🪱 Worm</option><option value="Shrimp">🦐 Shrimp</option><option value="Jig">🎨 Jig</option></select></div><div id="log"><p>准备好后点击抛竿。</p></div><div id="summary" style="display:none"></div><div id="shakeArea"></div><div id="reelChallenge" style="display:none"></div><div id="timerBar"><div id="timerFill"></div></div><div class="hint">昼夜会影响鱼种；数据只保存在本机。</div></div><div id="jfish-area"><div id="fish1" class="fish" style="position:fixed">🐟</div><div id="fish2" class="fish" style="position:fixed">🦈</div><div id="fish3" class="fish" style="position:fixed">🐠</div></div><div id="waveContainer"><svg viewBox="0 0 2400 100" preserveAspectRatio="none"><path class="wave-back" d="M0,30 C300,80 900,-20 1200,30 C1500,80 2100,-20 2400,30 L2400,100 L0,100 Z" fill="#61ceff"/><path class="wave-top" d="M0,60 C300,40 900,80 1200,60 C1500,40 2100,80 2400,60 L2400,100 L0,100 Z" fill="#29a4f6"/></svg></div><script src="game.js"></script></body></html>
