<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071d24"><title>Reality Fishing Adventure V4</title><style>
:root{--bg:#061a21;--panel:#0d2b35;--panel2:#153d47;--text:#eef8f5;--muted:#9db6b5;--line:#2c5860;--green:#78e0b6;--gold:#ffd16f;--hot:#ff917e;--blue:#79c8ef}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -8%,#174853,#092a33 38%,#061a21 100%);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;touch-action:manipulation}.app{max-width:720px;margin:auto;padding:14px 14px 44px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.brand b{font-size:15px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.ghost{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);border-radius:999px;padding:9px 12px}.hero{padding:26px 5px 14px}.kicker{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--gold)}h1{font-size:34px;line-height:1.08;margin:8px 0 10px}.lead{color:var(--muted);line-height:1.55}.card{background:rgba(13,43,53,.94);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}.card.gold{border-color:rgba(255,209,111,.48)}.card.green{border-color:rgba(120,224,182,.52)}.title{font-size:22px;line-height:1.28;margin:7px 0}.sub{font-size:14px;line-height:1.5;color:var(--muted)}.primary,.secondary,.choice,.tile,.fieldbtn{width:100%;min-height:54px;border-radius:17px;padding:14px 15px;margin-top:10px;cursor:pointer}.primary{border:0;background:var(--green);color:#05261e;font-weight:900}.secondary{border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--text)}.choice{border:1px solid transparent;background:var(--panel2);color:var(--text);text-align:left}.choice b{display:block;font-size:17px}.choice small{display:block;color:var(--muted);margin-top:5px;line-height:1.4}.choice strong{float:right;color:var(--gold)}.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.how div{padding:12px;border-radius:15px;background:rgba(255,255,255,.045);font-size:13px}.how b{display:block;color:var(--green);font-size:18px;margin-bottom:4px}.gain{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 10px;color:var(--muted);font-size:12px}.pill.on{color:var(--green);border-color:rgba(120,224,182,.55);background:rgba(120,224,182,.07)}.camera{position:relative;overflow:hidden;border-radius:24px;min-height:520px;background:linear-gradient(#183f47,#0b2831);border:1px solid #38656b}.camera video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#061a21}.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.2),transparent 35%,rgba(0,0,0,.62));pointer-events:none}.arui{position:relative;z-index:2;min-height:520px;padding:16px;display:flex;flex-direction:column}.arhead{display:flex;justify-content:space-between;gap:8px}.tag{display:inline-block;padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.25);font-size:12px}.prompt{margin-top:16px;background:rgba(4,24,30,.72);border:1px solid rgba(255,255,255,.18);border-radius:17px;padding:14px}.prompt b{font-size:19px;display:block}.prompt small{display:block;color:#d1e4e0;margin-top:5px;line-height:1.45}.reticle{margin:auto;width:116px;height:116px;border:2px solid var(--gold);border-radius:50%;position:relative;box-shadow:0 0 0 999px rgba(0,0,0,.07)}.reticle:before,.reticle:after{content:"";position:absolute;background:var(--gold)}.reticle:before{width:28px;height:2px;left:42px;top:56px}.reticle:after{width:2px;height:28px;left:56px;top:42px}.arbottom{margin-top:auto}.scanbtn{width:100%;min-height:58px;border:0;border-radius:18px;background:var(--gold);color:#2b2105;font-weight:950;font-size:17px}.skip{width:100%;border:0;background:transparent;color:#d4e2df;min-height:44px}.reward{animation:pop .34s ease;background:radial-gradient(circle at 50% 0,rgba(120,224,182,.19),rgba(13,43,53,.96) 58%);border-color:rgba(120,224,182,.65)}@keyframes pop{0%{opacity:.2;transform:scale(.96)}100%{opacity:1;transform:none}}.burst{text-align:center;font-size:58px;margin:7px 0 10px}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.node{min-height:100px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.035);padding:12px}.node.on{border-color:var(--gold);background:rgba(255,209,111,.08)}.node b{display:block}.node small{display:block;color:var(--muted);margin-top:6px}.field{min-height:450px;padding:18px;border-radius:24px;border:1px solid #37636b;background:linear-gradient(180deg,#194a53,#0d3741 52%,#08262f);position:relative;overflow:hidden}.field:after{content:"";position:absolute;left:-20%;right:-20%;bottom:-50px;height:220px;background:repeating-radial-gradient(ellipse at 50% 0,rgba(174,238,222,.14) 0 2px,transparent 3px 22px)}.field>*{position:relative;z-index:1}.fieldactions{margin-top:120px}.fieldbtn{border:1px solid #416f76;background:rgba(5,28,35,.82);color:var(--text);text-align:left}.fieldbtn b{font-size:17px}.fieldbtn span{float:right;font-size:23px}.tiny{font-size:11px;color:#789596;text-align:center;line-height:1.5;margin:18px 4px}.danger{color:var(--hot)}@media(max-width:440px){h1{font-size:30px}.how,.map{grid-template-columns:1fr}.camera,.arui{min-height:485px}}
</style></head><body><div id="app" class="app"></div><script>
(()=>{const app=document.querySelector('#app');const KEY='realityFishingV4';const base={discoveries:0,trips:0,arScans:0,map:{structure:false,edge:false,life:false},last:'还没有现实探索记录'};let save=(()=>{try{return Object.assign({},base,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return {...base}}})();let S={screen:'home',arStep:0,stream:null,event:null};const scans=[{id:'structure',icon:'🌿',title:'找一个“和周围不一样”的岸边结构',help:'草线、倒木、石头、阴影、突出/凹入都可以。',gain:'你会立刻得到一个“先从哪里开始”的任务。'},{id:'edge',icon:'🌊',title:'找一条明显的边界',help:'水色、流速、明暗、深浅变化，只找最明显的一条。',gain:'系统会把它变成下一段搜索路线。'},{id:'life',icon:'🐟',title:'找一种真实生物迹象',help:'小鱼、虫、鸟、炸水、鱼星；没有也可以明确记“没看到”。',gain:'这会帮助判断该继续找鱼还是开始调呈现。'}];function persist(){localStorage.setItem(KEY,JSON.stringify(save))}function tone(f=600,d=.07){try{const A=tone.a||(tone.a=new(window.AudioContext||window.webkitAudioContext)()),o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.setValueAtTime(.025,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(g).connect(A.destination);o.start();o.stop(A.currentTime+d)}catch{}}function vibe(){try{navigator.vibrate&&navigator.vibrate(35)}catch{}}function shell(body){app.innerHTML=`<div class="top"><div class="brand"><b>Reality Fishing Adventure</b><small>打开就有用 · Reality-first V4</small></div><button id="home" class="ghost">首页</button></div>${body}<div class="tiny">AR-lite 只帮助观察与记录，不声称镜头能看见水下鱼群；生产 AR 将使用 ARCore/ARKit 空间能力。</div>`;document.querySelector('#home').onclick=()=>{stopCam();S.screen='home';render()}}function home(){shell(`<div class="hero"><span class="kicker">先告诉你：点了有什么用</span><h1>30 秒内，给你一个现实里能做的动作。</h1><div class="lead">不是先学规则，也不是先填日志。你选一种玩法，系统马上给收益。</div></div><section class="card green"><div class="title">第一次来？直接“带我钓”</div><div class="sub">你会立刻拿到一个简单任务：先看哪里、先试什么、多久没反馈就换下一步。</div><button id="guide" class="primary">给我一个具体任务</button></section><section class="card gold"><div class="title">📷 AR 找线索</div><div class="sub">打开镜头扫岸边。每找到一类线索，个人水域地图就亮一块，并马上告诉你这条线索能怎么用。</div><button id="ar" class="primary">打开镜头，开始找</button></section><section class="card"><span class="kicker">怎么玩只有 3 步</span><div class="how"><div><b>1</b>系统给一个现实任务</div><div><b>2</b>手机放下，真的去钓</div><div><b>3</b>有变化时回来点一下</div></div><div class="gain"><span class="pill ${save.discoveries?'on':''}">地图发现 ${save.discoveries}</span><span class="pill ${save.trips?'on':''}">现实任务 ${save.trips}</span><span class="pill ${save.arScans?'on':''}">AR线索 ${save.arScans}</span></div></section>`);document.querySelector('#guide').onclick=()=>{tone(720);S.screen='mission';render()};document.querySelector('#ar').onclick=()=>{tone(760);S.screen='arIntro';render()}}
function mission(){shell(`<section class="card reward"><div class="burst">🎯</div><span class="kicker">现在就能用</span><div class="title">先沿“岸边有变化的地方”试 8 分钟。</div><div class="sub">只做一件事：找草、石、阴影、深浅变化中最明显的一个。8 分钟完全没鱼讯，就不要死守，转去找下一条边界。</div></section><section class="card"><span class="kicker">为什么这对你有用</span><div class="sub">你不需要先懂鱼情理论。第一局只练一件事：别随机下竿，先找“变化”。</div><button id="go" class="primary">明白了，我去试</button></section>`);document.querySelector('#go').onclick=()=>{save.trips++;save.last='完成过一次“先找变化”的现实任务';persist();S.screen='field';render()}}
function arIntro(){shell(`<section class="card gold"><div class="title">AR 不会告诉你“鱼就在这里”。</div><div class="sub">它只做一件真正有用的事：教你把眼前水域拆成线索，并把这些线索变成下一步行动。</div><div class="how"><div><b>🌿</b>找结构</div><div><b>🌊</b>找边界</div><div><b>🐟</b>找生命迹象</div></div><button id="cam" class="primary">允许摄像头，开始扫描</button><button id="demo" class="secondary">没有摄像头？用演示模式</button></section>`);document.querySelector('#cam').onclick=startCam;document.querySelector('#demo').onclick=()=>{S.screen='ar';render()}}
async function startCam(){try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});S.stream=st;S.screen='ar';render()}catch(e){S.screen='ar';render();setTimeout(()=>alert('摄像头未开启，已进入 AR 演示模式。实际手机 HTTPS 页面可请求后置摄像头。'),50)}}function stopCam(){if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}}
function ar(){const x=scans[Math.min(S.arStep,2)];shell(`<section class="camera"><video id="video" playsinline muted autoplay></video><div class="shade"></div><div class="arui"><div class="arhead"><span class="tag">AR SCOUT · ${S.arStep+1}/3</span><span class="tag">${x.icon}</span></div><div class="prompt"><b>${x.title}</b><small>${x.help}</small></div><div class="reticle"></div><div class="arbottom"><button id="lock" class="scanbtn">锁定这条线索</button><button id="skip" class="skip">这里没有明显线索</button></div></div></section>`);const v=document.querySelector('#video');if(S.stream){v.srcObject=S.stream;v.play().catch(()=>{})}document.querySelector('#lock').onclick=()=>scanResult(true);document.querySelector('#skip').onclick=()=>scanResult(false)}function scanResult(found){const x=scans[Math.min(S.arStep,2)];if(found){save.map[x.id]=true;save.discoveries++;save.arScans++;persist();tone(880,.1);vibe()}else tone(430,.06);S.screen='arReward';S.event=found?'found':'none';render()}
function arReward(){const x=scans[Math.min(S.arStep,2)];const found=S.event==='found';shell(`<section class="card reward"><div class="burst">${found?'✨':'○'}</div><span class="kicker">${found?'现实地图点亮':'没有发现也有价值'}</span><div class="title">${found?x.title.replace('找','已找到：'):'这类线索暂时没看到'}</div><div class="sub">${found?x.gain:'不要硬凑答案。明确“没看到”能避免系统把猜测当事实。'}</div><div class="map"><div class="node ${save.map.structure?'on':''}"><b>🌿 结构</b><small>${save.map.structure?'已点亮':'未知'}</small></div><div class="node ${save.map.edge?'on':''}"><b>🌊 边界</b><small>${save.map.edge?'已点亮':'未知'}</small></div><div class="node ${save.map.life?'on':''}"><b>🐟 生物</b><small>${save.map.life?'已点亮':'未知'}</small></div></div></section><button id="next" class="primary">${S.arStep<2?'继续扫下一类':'生成我的现场任务'}</button>`);document.querySelector('#next').onclick=()=>{if(S.arStep<2){S.arStep++;S.screen='ar';render()}else{stopCam();S.screen='arMission';render()}}}
function arMission(){let text='先从你刚才发现的“变化最明显”的区域开始，连续试 8 分钟。';if(save.map.structure&&save.map.edge)text='先从结构与边界重叠的位置开始；8 分钟没鱼讯，再沿边界移动，不要同时乱换所有东西。';else if(save.map.life)text='既然看到了生物迹象，先在附近做短时间搜索；若只有小鱼活动但没有目标鱼反应，再调整水层/呈现。';shell(`<section class="card reward"><div class="burst">🧭</div><span class="kicker">AR 扫描的真正奖励</span><div class="title">${text}</div><div class="sub">现在手机可以放下。AR 已经完成它该做的事：把“看水”变成一个具体行动。</div></section><button id="fish" class="primary">去钓，等现实回答</button>`);document.querySelector('#fish').onclick=()=>{save.trips++;save.last='完成过一次 AR 现场侦察';persist();S.screen='field';render()}}
function field(){shell(`<section class="field"><span class="kicker">REAL-WORLD RUN</span><div class="title">现在去钓。</div><div class="sub">不要盯手机。只有发生会改变判断的事情，再回来点。</div><div class="fieldactions"><button id="bite" class="fieldbtn"><b>有鱼讯</b><span>⚡</span></button><button id="catch" class="fieldbtn"><b>真的上鱼了</b><span>🐟</span></button><button id="zero" class="fieldbtn"><b>这一轮没反应</b><span>○</span></button></div></section>`);document.querySelector('#bite').onclick=()=>result('bite');document.querySelector('#catch').onclick=()=>result('catch');document.querySelector('#zero').onclick=()=>result('zero')}
function result(type){S.event=type;if(type==='catch'){tone(980,.12);vibe();save.last='一次现实任务成功连到了真实鱼获'}else if(type==='bite'){tone(820,.09);save.last='一次现实任务获得真实鱼讯'}else{tone(350,.07);save.last='一次无鱼讯帮助排除了当前方向'}persist();S.screen='result';render()}
function resultScreen(){const type=S.event;const data=type==='catch'?['🐟','命中了：现实结果和你的行动连上了。','这次最爽的不是积分，而是你刚才做的选择真的得到现实反馈。','相似条件下再复现一次']:type==='bite'?['⚡','突破：出现了真实鱼讯。','现在至少知道这个方向值得继续查，不必把整片水域全部推翻。','先保持位置，继续查水层/呈现']:['↯','反转：没鱼讯，但你没白钓。','这一轮让一个方向降温。游戏会把失败变成下一条更明确的路线。','换一条边界或结构，而不是原地乱换所有变量'];shell(`<section class="card reward"><div class="burst">${data[0]}</div><span class="kicker">即时反馈</span><div class="title">${data[1]}</div><div class="sub">${data[2]}</div></section><section class="card gold"><span class="kicker">NEXT MOVE</span><div class="title">${data[3]}</div></section><button id="again" class="primary">收下这次发现</button>`);document.querySelector('#again').onclick=()=>{S.arStep=0;S.screen='home';render()}}
function render(){({home,mission,arIntro,ar,arReward,arMission,field,result:resultScreen}[S.screen]||home)()}render()})();
</script></body></html>
