<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f8f5">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>My OS</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Microsoft YaHei",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f8f5;color:#17352d}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#fff;border:1px solid #dbe8e1;border-radius:24px;padding:30px;box-shadow:0 18px 50px rgba(33,75,61,.09)}h1{margin:0 0 10px;font-size:28px}.sub{color:#66766f;margin:0 0 22px}.bar{height:9px;background:#e7f0eb;border-radius:99px;overflow:hidden}.fill{height:100%;width:4%;background:linear-gradient(90deg,#6bb890,#2d8a62);transition:width .18s}.status{margin-top:14px;color:#536962;font-size:14px}.meta{margin-top:6px;color:#8a9993;font-size:12px}.err{display:none;margin-top:16px;padding:13px 14px;background:#fff3e8;border:1px solid #f1d1b2;border-radius:12px;color:#8a5426;line-height:1.65}button{border:0;border-radius:11px;background:#2d8a62;color:#fff;padding:10px 14px;font-weight:700;cursor:pointer;margin-top:10px}</style>
</head><body><div class="wrap"><div class="card"><h1>My OS</h1><p class="sub">正在准备你的自适应生活系统…</p><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status">准备载入 V23.2</div><div class="meta" id="meta">优先从已有本地应用快速升级；普通刷新直接从本地启动</div><div class="err" id="err"></div></div></div>
<script>
(async()=>{
const VERSION='23.2',COUNT=19,EXPECTED_LENGTH=108624,CACHE_KEY='my_os_app_shell_v23_2';
const PRIOR_KEYS=['my_os_app_shell_v23_1','my_os_app_shell_v23','my_os_app_shell_v22_1','my_os_app_shell_v22','my_os_app_shell_v21','my_os_app_shell_v20','my_os_app_shell_v19','my_os_app_shell_v18','my_os_app_shell_v17','my_os_app_shell_v16','my_os_app_shell_v15','my_os_app_shell_v14','my_os_app_shell_v13_1','my_os_app_shell_v13','my_os_app_shell_v12'];
const fill=document.getElementById('fill'),status=document.getElementById('status'),meta=document.getElementById('meta'),err=document.getElementById('err');
const progress=(v,t)=>{fill.style.width=Math.max(4,Math.min(100,v))+'%';if(t)status.textContent=t};
const launch=html=>{document.open();document.write(html);document.close()};
function removeKey(k){try{localStorage.removeItem(k)}catch(e){}}
function inject(html){
 const anchor="const KEY='eao_v4_data';";
 if(!html.includes(anchor))throw new Error('应用入口标记不存在');
 if(!html.includes('const titles='))html=html.replace(anchor,"const titles={dashboard:'总览',today:'今天',calibration:'校准 / 中断',discoveries:'发现',experiments:'实验',projects:'项目 / Resume',manual:'我的说明书',book:'系统学习',method:'方法速查'};\n"+anchor);
 const tail='renderDashboard();renderTodayHistory();renderCalibration();renderPatterns();renderExperiments();renderProjects();renderManual();initBookMode();';
 if(html.includes(tail)&&!html.includes('V20 resilient navigation'))html=html.replace(tail,"// V21 resilient navigation\ndocument.addEventListener('click',function(e){const p=e.target.closest&&e.target.closest('[data-page]');if(p){e.preventDefault();go(p.dataset.page);return}const g=e.target.closest&&e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go)}});\n"+tail);
 const hc='</'+'head>',bc='</'+'body>';
 const styles=[['v11.css','11'],['v12.css','12'],['v13.css','13'],['v14.css','14'],['v15.css','15'],['v16.css','16'],['v17.css','17'],['v18.css','18'],['v19.css','19'],['v20.css','20'],['v21.css','21'],['v22.css','22'],['v22_1_fix.css','22.1'],['v23.css','23'],['v23_1.css','23.1'],['v23_2.css','23.2']];
 html=html.replace(/<script[^>]+v18_patch\.js[^>]*><\/script>/g,'');
 const scripts=[['v11_patch.js','11'],['v12_patch.js','12'],['v13_patch.js','13'],['v13_fix.js','13.1'],['v14_patch.js','14'],['v15_patch.js','15'],['v16_patch.js','16'],['v17_patch.js','17'],['v18_runtime_fix.js','18.3'],['v19_patch.js','19'],['v20_patch.js','20'],['v21_patch.js','21'],['v22_patch.js','22'],['v23_patch.js','23'],['v23_1_patch.js','23.1'],['v23_2_patch.js','23.2']];
 styles.forEach(([f,v])=>{if(!html.includes(f))html=html.replace(hc,`<link rel="stylesheet" href="./${f}?v=${v}">`+hc)});
 scripts.forEach(([f,v])=>{if(!html.includes(f))html=html.replace(bc,'<script src="./'+f+'?v='+v+'"></'+'script>'+bc)});
 html=html.replace(/Engineer Adaptive OS V8/g,'My OS V23.2').replace(/My OS V23(?!\.)/g,'My OS V23.2').replace(/My OS V22\.1/g,'My OS V23.2').replace(/My OS V22/g,'My OS V23.2').replace(/My OS V21/g,'My OS V23.2').replace(/My OS V20/g,'My OS V23.2').replace(/My OS V19/g,'My OS V23.2').replace(/My OS V18/g,'My OS V23.2').replace(/My OS V17/g,'My OS V23.2').replace(/My OS V16/g,'My OS V23.2').replace(/My OS V15/g,'My OS V23.2').replace(/My OS V14/g,'My OS V23.2').replace(/My OS V13\.1/g,'My OS V23.2').replace(/My OS V13/g,'My OS V23.2');
 return html;
}
function getLocal(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function putLocal(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
try{
 const u=new URLSearchParams(location.search);
 if(u.get('deep')==='1'){[CACHE_KEY,...PRIOR_KEYS,'eao_app_shell_v11','eao_app_shell_v10_1','eao_app_shell_v10'].forEach(removeKey)}
 else if(u.get('update')==='1')removeKey(CACHE_KEY);
 if(u.has('deep')||u.has('update')){u.delete('deep');u.delete('update');try{history.replaceState(null,'',location.pathname+(u.toString()?'?'+u.toString():''))}catch(e){}}
 let cached=getLocal(CACHE_KEY);
 if(cached&&cached.includes('v23_2_patch.js')&&cached.includes('v18_runtime_fix.js')){progress(100,'从本地启动');meta.textContent='My OS V23.2 已缓存 · 普通刷新无需重新下载核心内容';await new Promise(r=>setTimeout(r,20));launch(cached);return}
 let html='';
 for(const k of PRIOR_KEYS){const prior=getLocal(k);if(prior&&prior.includes('v13_patch.js')){progress(58,'正在从已有版本快速升级到 V23.2…');html=inject(prior);break}}
 if(!html){
   if(!('DecompressionStream'in window))throw new Error('当前浏览器不支持内置 gzip 解压，请升级 Chrome / Edge');
   const parts=[];let loaded=0;
   for(let i=0;i<COUNT;i++){const n=String(i).padStart(2,'0');progress(5+i/COUNT*68,`首次载入核心内容 ${i+1}/${COUNT}`);const r=await fetch(`./v9/${n}.txt?v=9`,{cache:'force-cache'});if(!r.ok)throw new Error(`核心数据 ${n} HTTP ${r.status}`);const t=(await r.text()).trim();if(!t)throw new Error(`核心数据 ${n} 为空`);parts.push(t);loaded+=t.length;meta.textContent=`已载入 ${loaded.toLocaleString()} / ${EXPECTED_LENGTH.toLocaleString()} 字符`}
   progress(78,'正在校验…');const b64=parts.join('');if(b64.length!==EXPECTED_LENGTH)throw new Error(`核心数据不完整：${b64.length}/${EXPECTED_LENGTH}`);const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
   progress(87,'正在解压…');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));html=await new Response(stream).text();html=inject(html);
 }
 progress(93,'正在安装 V23.2 后台锁屏提醒…');if(!html.includes('v18_runtime_fix.js')||!html.includes('v23_2_patch.js'))throw new Error('V23.2 功能注入失败');
 if(putLocal(CACHE_KEY,html))meta.textContent='V23.2 完整应用已缓存；以后刷新直接启动';else meta.textContent='浏览器未允许应用缓存，本次仍可使用';
 progress(100,'启动完成');await new Promise(r=>setTimeout(r,45));launch(html);
}catch(e){console.error('[My OS V23.2]',e);status.textContent='未能启动';err.style.display='block';err.innerHTML='<b>加载失败</b><br>'+String(e.message||e)+'<br><button onclick="location.href=\'/time/?update=1&v=23.2&t=\'+Date.now()">重新升级</button><button onclick="location.href=\'/time/?deep=1&v=23.2&t=\'+Date.now()" style="margin-left:6px;background:#6d7d76">深度重载</button>'}
})();
</script></body></html>
