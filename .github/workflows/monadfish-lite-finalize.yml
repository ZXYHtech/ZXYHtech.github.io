name: Finalize MonadFish Lite

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monadfish-lite-finalize.yml'
      - '.github/scripts/monadfish_source_lite.py'
      - '.github/scripts/monadfish_zh_lite.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch pinned MIT upstream
        run: |
          rm -rf /tmp/monadfish-upstream
          git clone --depth 1 https://github.com/KaimiEwl/fishing-game.git /tmp/monadfish-upstream
          cd /tmp/monadfish-upstream
          git fetch --depth 1 origin 817708f05b609accb5b8ed39c299e318459044cf
          git checkout --detach 817708f05b609accb5b8ed39c299e318459044cf

      - name: Apply source-level Chinese and wallet-free Lite patch
        run: |
          python3 .github/scripts/monadfish_source_lite.py /tmp/monadfish-upstream

      - name: Build wallet-free MonadFish client
        working-directory: /tmp/monadfish-upstream
        env:
          VITE_BASE_PATH: /fish/games/monadfish/
        run: |
          npm ci
          npm run build

      - name: Verify wallet frameworks are absent from emitted assets
        run: |
          set -euo pipefail
          echo 'Checking generated filenames for wallet framework chunks...'
          if find /tmp/monadfish-upstream/dist/assets -maxdepth 1 -type f \( \
            -iname '*wallet*' -o \
            -iname '*metamask*' -o \
            -iname '*rainbow*' -o \
            -iname '*w3m-modal*' -o \
            -iname '*coinbasewallet*' \
          \) -print | grep -q .; then
            echo 'Wallet-specific chunks were emitted:'
            find /tmp/monadfish-upstream/dist/assets -maxdepth 1 -type f \( \
              -iname '*wallet*' -o \
              -iname '*metamask*' -o \
              -iname '*rainbow*' -o \
              -iname '*w3m-modal*' -o \
              -iname '*coinbasewallet*' \
            \) -print
            exit 1
          fi
          echo 'PASS: no wallet-specific output chunks'

      - name: Reuse local API compatibility layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/monadfish-lite.yml').read_text(encoding='utf-8')
          start="          cat > /tmp/monadfish-upstream/dist/local-api-shim.js <<'SHIM'\n"
          end="          SHIM\n"
          if start not in src:
              raise SystemExit('Could not find local-api-shim start marker')
          block=src.split(start,1)[1].split(end,1)[0]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          shim='\n'.join(lines)+'\n'
          shim=shim.replace(
              "const SMOKE = new URLSearchParams(location.search).get('smoke') === '1';",
              "const SMOKE = new URLSearchParams(location.search).get('smoke') === '1';\n            if (SMOKE) Math.random = () => 0.01;"
          )
          Path('/tmp/monadfish-upstream/dist/local-api-shim.js').write_text(shim,encoding='utf-8')

          p=Path('/tmp/monadfish-upstream/dist/index.html')
          html=p.read_text(encoding='utf-8')
          marker='<script type="module"'
          inject='<script src="/fish/games/monadfish/local-api-shim.js"></script>\n    '
          if 'local-api-shim.js' not in html:
              html=html.replace(marker,inject+marker,1)
          p.write_text(html,encoding='utf-8')
          PY

      - name: Apply Chinese Lite adaptation
        run: |
          python3 .github/scripts/monadfish_zh_lite.py /tmp/monadfish-upstream/dist
          cp /tmp/monadfish-upstream/LICENSE /tmp/monadfish-upstream/dist/LICENSE-MonadFish.txt
          cat > /tmp/monadfish-upstream/dist/README-LITE.txt <<'TXT'
          MonadFish Chinese Lite integration for ZXYHtech /fish/
          Upstream: https://github.com/KaimiEwl/fishing-game
          Pinned source: 817708f05b609accb5b8ed39c299e318459044cf
          License: MIT (see LICENSE-MonadFish.txt)
          Adaptation: source-level wallet stack removal, localStorage-backed API compatibility, Chinese UI localization and a Chinese game-guide page.
          Wallet providers/connectors, wallet verification, MON transactions and authoritative online leaderboard are not part of the Lite player build.
          TXT

      - name: Stage same-origin mirror
        run: |
          rm -rf fish/games/monadfish
          mkdir -p fish/games/monadfish
          cp -a /tmp/monadfish-upstream/dist/. fish/games/monadfish/

      - name: Real mobile Chromium play test
        run: |
          npm install --no-save playwright-core@1.55.0
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/monadfish-http.log 2>&1 &
          sleep 1
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const { execSync } = require('child_process');
          function chromePath(){
            for(const cmd of ['which google-chrome','which google-chrome-stable','which chromium','which chromium-browser']){
              try{const p=execSync(cmd,{encoding:'utf8'}).trim();if(p)return p}catch{}
            }
            throw new Error('No Chromium found');
          }
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:chromePath(),args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/fish/games/monadfish/?smoke=1',{waitUntil:'networkidle',timeout:90000});
            await page.waitForFunction(
              ()=>window.__MONADFISH_LITE_READY__===true && window.__MONADFISH_ZH_LITE__===true,
              {timeout:15000}
            );

            const cast=page.getByRole('button',{name:'抛竿'});
            await cast.waitFor({state:'visible',timeout:30000});
            await cast.click();
            const hook=page.getByRole('button',{name:'提竿'});
            await hook.waitFor({state:'visible',timeout:10000});
            await hook.click();
            await page.getByText('钓到了！').waitFor({state:'visible',timeout:10000});

            await page.getByRole('link',{name:'打开游戏说明'}).waitFor({state:'visible',timeout:10000});

            const visibleWalletControls=await page
              .locator('button:not([data-zxyh-wallet-hidden="1"]),a:not([data-zxyh-wallet-hidden="1"]),[role="button"]:not([data-zxyh-wallet-hidden="1"])')
              .evaluateAll(nodes=>nodes.filter(el=>
                /(connect\s+wallet|verify\s+wallet|wallet\b|withdraw\b|deposit\b|claim\s+mon\b|buy\s+mon\b|pay\s+with\s+mon)/i
                  .test((el.textContent||'')+' '+(el.getAttribute('aria-label')||''))
              ).length);
            if(visibleWalletControls!==0) throw new Error('Wallet controls are still visible');

            const stored=await page.evaluate(
              ()=>JSON.parse(localStorage.getItem('zxyh_monadfish_lite_player_v1')||'{}')
            );
            if(!(stored.total_catches>=1)) throw new Error('Catch did not persist locally');

            const guide=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            await guide.goto(
              'http://127.0.0.1:4173/fish/games/monadfish/guide.html',
              {waitUntil:'domcontentloaded',timeout:30000}
            );
            await guide.getByRole('heading',{name:'🎣 MonadFish 中文版游戏说明'})
              .waitFor({state:'visible',timeout:10000});
            await guide.getByText('本版本已经移除钱包入口和 MON / 区块链交易功能。',{exact:false})
              .waitFor({state:'visible',timeout:10000});

            const blocking=errors.filter(e=>/guest session|player-actions|Failed to fetch/i.test(e));
            if(blocking.length) throw new Error('Blocking runtime errors: '+blocking.join(' | '));
            console.log('PASS: Chinese MonadFish Lite playability, localization, wallet removal and guide page');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Commit only after playability passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fish/games/monadfish
          if git diff --cached --quiet; then
            echo 'No mirror changes.'
          else
            git commit -m 'fish: publish verified Chinese MonadFish Lite mirror'
            git push
          fi
